services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_broker_web
    restart: always
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-broker.entrypoints=websecure"
      - "traefik.http.routers.ai-broker.rule=Host(`app.inmobia360.com`) || Host(`broker.inmobia360.com`) || Host(`asesor.inmobia360.com`)"
      - "traefik.http.routers.ai-broker.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-broker.loadbalancer.server.port=3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://broker_user:broker_password@postgres:5432/ai_broker_db
      - OLLAMA_URL=${OLLAMA_URL:-https://ollama-pisf.srv1823868.hstgr.cloud/api/chat}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-30000}
    volumes:
      - storage_data:/app/storage/private
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_broker_db
    restart: always
    environment:
      POSTGRES_USER: broker_user
      POSTGRES_PASSWORD: broker_password
      POSTGRES_DB: ai_broker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/lib/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
  storage_data:
